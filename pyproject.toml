[project]
name = "ai-web-scraper"
version = "0.1.0"
description = "AI-powered structured web data extraction service (FastAPI + LLM)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "playwright",
    "selectolax",
    "pydantic>=2",
    "pydantic-settings",
    "jsonschema[format]",
    "jinja2",
    "anthropic",
    "openai",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
